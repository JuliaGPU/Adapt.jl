steps:
  - group: "CUDA"
    key: "cuda"
    steps:
      - label: "Julia {{matrix.julia}}"
        plugins:
          - JuliaCI/julia#v1:
              version: "{{matrix.julia}}"
          - JuliaCI/julia-test#v1:
              test_args: "--quickfail"
              allow_reresolve: false
          - JuliaCI/julia-coverage#v1:
              dirs:
                - src
                - ext
        agents:
          queue: "cuda"
        commands: |
          julia --project -e '
            using Pkg, TOML

            adapt  = pwd()
            devdir = mktempdir()
            cuda   = joinpath(devdir, "CUDA")

            println("--- :julia: Installing CUDA")
            withenv("JULIA_PKG_PRECOMPILE_AUTO" => 0,
                    "JULIA_PKG_DEVDIR" => devdir) do
              try
                Pkg.activate(; temp=true)
                Pkg.develop("CUDA")
                Pkg.activate(cuda)

                pkgs = [PackageSpec(path=adapt)]
                if VERSION < v"1.11"
                  # Julia 1.10 ignores [sources], so develop the packages
                  # that live in the CUDA.jl repository explicitly
                  test = joinpath(cuda, "test")
                  sources = TOML.parsefile(joinpath(test, "Project.toml"))["sources"]
                  for (name, source) in sources
                    name == "CUDA" && continue
                    push!(pkgs, PackageSpec(path=normpath(test, source["path"])))
                  end
                end
                Pkg.develop(pkgs)
              catch err
                @error "Could not install CUDA" exception=(err,catch_backtrace())
                exit(3)
              end
            end

            println("+++ :julia: Running tests")
            Pkg.test(; coverage=true)'
        if: |
          build.message =~ /\[only tests\]/ ||
          build.message =~ /\[only cuda\]/ ||
          build.message !~ /\[only/ &&
            build.message !~ /\[skip tests\]/ &&
            build.message !~ /\[skip cuda\]/
        timeout_in_minutes: 90
        matrix:
          setup:
            julia:
              - "1.10"
              - "1.11"
              - "1.12"
              - "1.13-nightly"
              - "nightly"
          adjustments:
            - with:
                julia: "1.13-nightly"
              soft_fail: true
            - with:
                julia: "nightly"
              soft_fail: true

  - group: "AMDGPU"
    key: "amdgpu"
    steps:
      - label: "Julia {{matrix.julia}}"
        plugins:
          - JuliaCI/julia#v1:
              version: "{{matrix.julia}}"
          - JuliaCI/julia-test#v1:
              test_args: "--quickfail"
              allow_reresolve: false
          - JuliaCI/julia-coverage#v1:
              dirs:
                - src
                - ext
        agents:
          queue: "rocm"
          rocmgpu: "*"
        commands: |
          julia --project -e '
            using Pkg

            adapt  = pwd()
            devdir = mktempdir()
            amdgpu = joinpath(devdir, "AMDGPU")

            println("--- :julia: Installing AMDGPU")
            withenv("JULIA_PKG_PRECOMPILE_AUTO" => 0,
                    "JULIA_PKG_DEVDIR" => devdir) do
              try
                Pkg.activate(; temp=true)
                Pkg.develop("AMDGPU")
                Pkg.activate(amdgpu)
                Pkg.develop(PackageSpec(path=adapt))
              catch err
                @error "Could not install AMDGPU" exception=(err,catch_backtrace())
                exit(3)
              end
            end

            println("+++ :julia: Running tests")
            Pkg.test(; coverage=true)'
        if: |
          build.message =~ /\[only tests\]/ ||
          build.message =~ /\[only amdgpu\]/ ||
          build.message !~ /\[only/ &&
            build.message !~ /\[skip tests\]/ &&
            build.message !~ /\[skip amdgpu\]/
        timeout_in_minutes: 90
        matrix:
          setup:
            julia:
              - "1.10"
              - "1.11"
              - "1.12"
              - "1.13-nightly"
              - "nightly"
          adjustments:
            - with:
                julia: "1.13-nightly"
              soft_fail: true
            - with:
                julia: "nightly"
              soft_fail: true

